server.port=${PORT:8080}
spring.application.name=demeter
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.main.banner-mode=off
spring.web.resources.cache.cachecontrol.max-age=1h
spring.web.resources.cache.cachecontrol.cache-public=true
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml,application/geo+json
server.compression.min-response-size=1024
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=64KB
server.max-http-request-header-size=16KB
spring.servlet.multipart.enabled=false
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.level.root=INFO
logging.level.mx.rastro=INFO


